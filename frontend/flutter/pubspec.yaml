name: sound_accessibility_app
description: "Cross-platform Flutter accessibility app for sound and vibration alerts"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.1.2
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: 0.20.2
  vibration: 3.2.0
  flutter_svg: ^2.0.9
  record: ^7.1.1
  http: ^1.6.0
  path_provider: ^2.1.6
  flutter_riverpod: ^2.6.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/sounds/
    - assets/models/
